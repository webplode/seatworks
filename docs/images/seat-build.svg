<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="How a seat is built: roles.json, the harness files, content, the settings layers and the catalogs feed three moments. Plugin start writes the Paseo providers, agent.create builds the seat directory and shapes the launch, and session_open points the agent at that directory and writes the team block into the project's AGENTS.md.">
<title>How a seat is built: roles.json, the harness files, content, the settings layers and the catalogs feed three moments. Plugin start writes the Paseo providers, agent.create builds the seat directory and shapes the launch, and session_open points the agent at that directory and writes the team block into the project's AGENTS.md.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="559" rx="18"/>
<text class="h1" x="32" y="46">From data to a running seat</text>
<text class="lede" x="32" y="70">The same files answer three questions: what Paseo offers, what a seat is, and where the agent reads it.</text>
<rect class="group" x="24" y="100" width="222" height="436" rx="14"/>
<text class="group-label" x="40" y="124">DATA, NOT CODE</text>
<rect class="node" x="40" y="136" width="190" height="54" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="56" y="159.5" text-anchor="start" style="fill:var(--slate-ink)">roles.json</text>
<text class="sub" x="56" y="178.5" text-anchor="start">roles, prefix, attention</text>
<rect class="node" x="40" y="206" width="190" height="54" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="56" y="229.5" text-anchor="start" style="fill:var(--slate-ink)">harness/&lt;agent&gt;/</text>
<text class="sub" x="56" y="248.5" text-anchor="start">contract and settings</text>
<rect class="node" x="40" y="276" width="190" height="54" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="56" y="299.5" text-anchor="start" style="fill:var(--slate-ink)">content/</text>
<text class="sub" x="56" y="318.5" text-anchor="start">prompts, skills, team block</text>
<rect class="node" x="40" y="346" width="190" height="54" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="56" y="369.5" text-anchor="start" style="fill:var(--slate-ink)">settings layers</text>
<text class="sub" x="56" y="388.5" text-anchor="start">machine, then project</text>
<rect class="node" x="40" y="416" width="190" height="54" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="56" y="439.5" text-anchor="start" style="fill:var(--slate-ink)">catalog/</text>
<text class="sub" x="56" y="458.5" text-anchor="start">MCP, sensor, Watcher kinds</text>
<text class="note" x="40" y="518" text-anchor="start">A bad kit file fails the load, by name.</text>
<path class="edge" d="M230,163 L272,163" style="stroke:var(--slate)"/>
<path class="edge" d="M230,233 L272,233" style="stroke:var(--slate)"/>
<path class="edge" d="M230,303 L272,303" style="stroke:var(--slate)"/>
<path class="edge" d="M230,373 L272,373" style="stroke:var(--slate)"/>
<path class="edge" d="M230,443 L272,443" style="stroke:var(--slate)"/>
<path class="edge" d="M272,163 L272,443" style="stroke:var(--slate)"/>
<rect class="node" x="300" y="136" width="316" height="70" rx="10" style="fill:var(--violet-fill);stroke:var(--violet)"/>
<text class="title" x="458" y="159" text-anchor="middle" style="fill:var(--violet-ink)">plugin start</text>
<text class="sub" x="458" y="178" text-anchor="middle">one Paseo provider and profile per role</text>
<text class="sub" x="458" y="195" text-anchor="middle">and agent: twenty of each in the kit</text>
<rect class="node" x="300" y="246" width="316" height="70" rx="10" style="fill:var(--violet-fill);stroke:var(--violet)"/>
<text class="title" x="458" y="269" text-anchor="middle" style="fill:var(--violet-ink)">before agent.create</text>
<text class="sub" x="458" y="288" text-anchor="middle">build the seat directory, then shape</text>
<text class="sub" x="458" y="305" text-anchor="middle">model, mode, prompt, MCP, sandbox</text>
<rect class="node" x="300" y="356" width="316" height="70" rx="10" style="fill:var(--violet-fill);stroke:var(--violet)"/>
<text class="title" x="458" y="379" text-anchor="middle" style="fill:var(--violet-ink)">before session_open</text>
<text class="sub" x="458" y="398" text-anchor="middle">point the agent at its seat directory, set</text>
<text class="sub" x="458" y="415" text-anchor="middle">SEATWORKS_ vars, write the team block</text>
<path class="edge" d="M272,171 L300,171" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge" d="M272,281 L300,281" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge" d="M272,391 L300,391" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<rect class="node dash" x="300" y="460" width="316" height="56" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="458" y="484.5" text-anchor="middle" style="fill:var(--slate-ink)">bin/seat-room</text>
<text class="sub" x="458" y="503.5" text-anchor="middle">checks the launch, then execs Claude</text>
<path class="edge" d="M458,426 L458,460" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<rect class="group" x="652" y="100" width="284" height="436" rx="14"/>
<text class="group-label" x="668" y="124">WHAT LANDS</text>
<rect class="node" x="668" y="136" width="252" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="684" y="159" text-anchor="start" style="fill:var(--slate-ink)">~/.paseo/config.json</text>
<text class="sub mono" x="684" y="178" text-anchor="start">agents.providers</text>
<text class="sub mono" x="684" y="195" text-anchor="start">daemon.agentProfiles</text>
<rect class="node" x="668" y="246" width="252" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="684" y="269" text-anchor="start" style="fill:var(--slate-ink)">the seat directory</text>
<text class="sub" x="684" y="288" text-anchor="start">settings, MCP, skills, logins, prompt;</text>
<text class="sub" x="684" y="305" text-anchor="start">written only if the whole seat builds</text>
<rect class="node" x="668" y="356" width="252" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="684" y="379" text-anchor="start" style="fill:var(--slate-ink)">the seat's environment</text>
<text class="sub" x="684" y="398" text-anchor="start">config dir → the seat directory,</text>
<text class="sub" x="684" y="415" text-anchor="start">and three SEATWORKS_ variables</text>
<path class="edge" d="M616,171 L668,171" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge" d="M616,281 L668,281" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge" d="M616,391 L668,391" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<rect class="node" x="668" y="446" width="252" height="70" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="684" y="469" text-anchor="start" style="fill:var(--slate-ink)">the project's AGENTS.md</text>
<text class="sub" x="684" y="488" text-anchor="start">the team block, and a pointer</text>
<text class="sub" x="684" y="505" text-anchor="start">to it in CLAUDE.md</text>
<path class="edge" d="M634,391 L634.0,473.0 Q634,481 642.0,481.0 L668,481" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<circle cx="300" cy="136" r="11" style="fill:var(--violet)"/>
<text class="badge-text" x="300" y="140" text-anchor="middle">1</text>
<circle cx="300" cy="246" r="11" style="fill:var(--violet)"/>
<text class="badge-text" x="300" y="250" text-anchor="middle">2</text>
<circle cx="300" cy="356" r="11" style="fill:var(--violet)"/>
<text class="badge-text" x="300" y="360" text-anchor="middle">3</text>
</svg>
